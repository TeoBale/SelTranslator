name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify SDK
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Behavioral tests
        run: swift test --package-path Packages/TranslationCore
      - name: Build and package
        run: scripts/package.sh
      - name: Verify packaged artifact
        run: |
          mkdir -p build/unpacked
          ditto -x -k build/dist/*-local.zip build/unpacked
          scripts/validate-app.sh build/unpacked/SelectionTranslator.app
      - uses: actions/upload-artifact@v4
        with:
          name: SelectionTranslator-local
          path: build/dist/
          if-no-files-found: error
